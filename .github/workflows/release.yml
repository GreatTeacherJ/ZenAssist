name: Export model on release

on:
  release:
    types: [published]       # se déclenche quand une release est publiée

permissions:
  contents: write            # nécessaire pour ajouter un asset à la release

jobs:
  export:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest   # machine virtuelle fournie par GitHub
    steps:
      - uses: actions/checkout@v4          # récupère le code

      - uses: astral-sh/setup-uv@v5        # installe uv

      - run: uv sync                       # installe les dépendances du pyproject

      - name: Download training data
        run: curl -L -o src/data/dataSet_train.csv.gz "https://github.com/GreatTeacherJ/ZenAssist/releases/download/data_set_v1/dataSet_train.csv.gz"   # à adapter
      
      - name: Train and export model
        run: uv run python src/app/export_model.py

      - name: Upload model artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            src/model/model.pkl \
            src/model/lab_enc.pkl \
            --clobber

